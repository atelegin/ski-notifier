name: Daily Ski Notifier

on:
  schedule:
    # Daily forecast (15:00 UTC = 16:00 CET winter / 17:00 CEST summer)
    - cron: '0 15 * * *'
    # Process /refresh commands every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:  # Manual trigger for testing

jobs:
  notify:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run notifier
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "*/30 * * * *" ]; then
            python -m ski_notifier.main --mode commands
          else
            python -m ski_notifier.main
          fi
